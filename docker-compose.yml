services:
  # 后端镜像已经内置播放签名服务（unidbg + App 自带 libmetasec_ml.so），
  # 不需要再单独跑一个 hongguo-signer 容器。
  #
  # 2026-11-26：以前这里挂着 depends_on: service_healthy，一旦 hongguo-signer
  # 拉不下来或起不来，后端容器就永远停在 Created 不启动 —— 手机端报
  # 「后端连不上」，一集都播不了。依赖已删掉，后端不再被别的容器卡住。
  veyra-backend:
    image: gybeyond/veyra-backend:latest
    container_name: veyra
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - PORT=8888
      - DATA_DIR=/data
      - ADMIN_PASSWORD=change-me   # WebUI 管理台密码（务必改为强密码；勿把真实密码提交进仓库）
      # 留空 = 用镜像内置的签名服务；只有自己另跑签名容器时才填。
      # - HG_SIGNER=http://hongguo-signer:19830
    volumes:
      - ./data:/data            # 用户/任务/头像等数据
      - /volume1/gy/veyra:/video  # NAS 下载合并产物（固定 /video 挂载）
