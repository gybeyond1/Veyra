name: Desktop Build

# 只在 Windows runner 上出安装包：ffmpeg 二进制、NSIS 打包都按目标平台来
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（写进安装包名，例如 0.1.0）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 版本号
        if: github.event.inputs.version != ''
        working-directory: desktop
        shell: bash
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version

      - name: 类型检查
        working-directory: desktop
        run: npm run typecheck

      # mpv 播放内核几十 MB，不进 git，打包前现拉（H.265 原片直放靠它）
      - name: 拉取 mpv
        working-directory: desktop
        run: npm run fetch:mpv

      - name: 构建
        working-directory: desktop
        run: npm run build

      - name: 打包 Windows 安装程序
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-desktop-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      # 和手机/电视的 APK 挂在同一个 vX.Y.Z Release 上：
      # 后端 app-updater 只认 v 开头的 tag，这样电脑端才能从后端检查更新。
      # 只 upload 资产、不 create/edit——release 的标题与更新日志交给 release.yml，
      # 两边同时改同一个 release 会互相覆盖。
      - name: 附到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # 等 release.yml 把 release 建出来（最多 5 分钟）
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Veyra $TAG" \
              --notes "Windows 安装包（x64），自带 ffmpeg。首次打开如果 SmartScreen 提示，点「更多信息 → 仍要运行」。" --draft
          gh release upload "$TAG" release/*.exe --clobber

      # 手动触发也发一版，这样用户能从 Release 直接下（Actions 的 artifact 需要登录）
      - name: 手动触发时上传到同版本 Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Veyra ${{ github.event.inputs.version }}" \
              --notes "Windows x64 安装包，自带 ffmpeg。首次打开如果 SmartScreen 提示，点「更多信息 → 仍要运行」。" --latest=false
          gh release upload "$TAG" release/*.exe --clobber
