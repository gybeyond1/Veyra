name: Desktop Build

# 只在 Windows runner 上出安装包：ffmpeg 二进制、NSIS 打包都按目标平台来
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（写进安装包名，例如 0.1.0）'
        required: false
        default: ''
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: desktop
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 版本号
        if: github.event.inputs.version != ''
        working-directory: desktop
        shell: bash
        run: npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version

      - name: 类型检查
        working-directory: desktop
        run: npm run typecheck

      - name: 构建
        working-directory: desktop
        run: npm run build

      - name: 打包 Windows 安装程序
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: veyra-desktop-windows
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: 附到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          name: Veyra 桌面端 ${{ github.ref_name }}
          body: |
            Windows 安装包（x64）。首次启动会校验自带的 ffmpeg。
            下载目录、并发数在「设置」里改；账号与手机端共用同一台服务器。

      # 手动触发也发一版，这样用户能从 Release 直接下（Actions 的 artifact 需要登录）
      - name: 手动触发时发 Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="desktop-v${{ github.event.inputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" release/*.exe \
            --title "Veyra 桌面端 ${{ github.event.inputs.version }}" \
            --notes "Windows x64 安装包，自带 ffmpeg。首次打开如果 SmartScreen 提示，点「更多信息 → 仍要运行」。" \
            --latest=false
