name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '可选：release tag 名（留空则用 app/build.gradle 的 versionName，如 v0.20.1）'
        required: false
        type: string
      release_notes:
        description: '可选：本次 release 介绍（留空则自动根据两个 tag 间的 commit 生成中文更新日志）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉全历史 + tag：更新日志需要上一个 v* tag 到 HEAD 的完整 commit 列表
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "platforms;android-37" > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Set up Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin.zip -d /opt/kotlin/
          echo "KOTLIN_HOME=/opt/kotlin/kotlinc" >> $GITHUB_ENV

      # 后端镜像：release 里那份 tar.gz 必须和本次 tag 的 server 代码一致。
      # 以前是直接 pull latest——打 tag 时 docker-build 可能还在排队，打进 release 的就是
      # 上一版镜像。现在在这里自己构建一次（命中 registry 缓存通常 1~2 分钟），
      # 顺带把 amd64+arm64 的 manifest list 推到 Hub。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.VEYRA_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/veyra-release.keystore

      - name: Build release APK
        env:
          CHENGZI_KEYSTORE: ${{ runner.temp }}/veyra-release.keystore
          CHENGZI_STORE_PASS: ${{ secrets.Veyra_STORE_PASS }}
          CHENGZI_KEY_PASS: ${{ secrets.Veyra_KEY_PASS }}
          CHENGZI_KEY_ALIAS: ${{ secrets.Veyra_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            # 没指定 tag 就用 app/build.gradle 里的 versionName，让人一眼看出版本号
            VER=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
            if [ -n "$VER" ]; then TAG="v$VER"; else TAG="v$(date +%Y%m%d-%H%M)"; fi
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          # APK 改名：Veyra-<版本>.apk 给手机/平板，Veyra-TV-<版本>.apk 给电视（轻量构建）。
          # 名字里的版本号不带 v：GitHub 的 assets 是**按名字排序**返回的，
          # 老版本 App 直接取「第一个 .apk」——Veyra-v0.24.2.apk 排在 Veyra-TV-v0.24.2.apk 后面，
          # 于是手机端把电视包下走，装出个 TV App、版本号还不涨，下次启动继续提示更新。
          # 去掉 v 之后 '0.24.3' < 'tv-0.24.3'，手机包稳定排第一，老客户端也能自己修好。
          # 有 flavor 之后产物会多一层 flavor 目录（outputs/apk/<flavor>/release/），用 find 兜住两种结构
          PHONE_APK="Veyra-${TAG#v}.apk"
          TV_APK="Veyra-TV-${TAG#v}.apk"
          cp "$(find app/build/outputs/apk -name 'app-mobile-release.apk' | head -1)" "$PHONE_APK"
          cp "$(find app/build/outputs/apk -name 'app-tv-release.apk' | head -1)" "$TV_APK"
          echo "PHONE_APK=$PHONE_APK" >> $GITHUB_ENV
          echo "TV_APK=$TV_APK" >> $GITHUB_ENV
          # 后端镜像：构建 → 推 Hub（amd64 + arm64 合成一个 manifest list）→ 再拉回本地导出两个离线包。
          # buildx 的产物留在 builder 里，docker save 拿不到，所以必须先 pull 回来。
          IMG="${{ secrets.DOCKERHUB_USERNAME }}/veyra-backend:latest"
          VER="${TAG#v}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$IMG" \
            --push \
            --provenance=false \
            --cache-from "type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/veyra-backend:cache" \
            --cache-to "type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/veyra-backend:cache,mode=max" \
            ./server

          # 两次 pull 会覆盖同一个本地 tag，所以必须 pull→save 紧挨着写，不能重排。
          # gzip 用 -6：镜像里大部分是已压缩的 layer，-9 压不出体积还多花几分钟。
          docker pull --platform linux/amd64 "$IMG"
          docker image inspect --format 'amd64 离线包: {{.Os}}/{{.Architecture}}' "$IMG"
          # 镜像自检：0.28.9 的 Dockerfile 逐个文件 COPY，新增 server/sources/ 时漏了一行，
          # 线上容器直接 MODULE_NOT_FOUND。这里在发版前把常驻模块 require 一遍，
          # 少文件当场红，而不是等用户 docker compose up 才发现。
          docker run --rm --entrypoint node "$IMG" -e "require('./sources'); require('./device-hub'); require('./app-updater'); console.log('镜像自检通过：模块齐全')"
          docker save "$IMG" | gzip -6 > "veyra-backend-${VER}-amd64.tar.gz"

          docker pull --platform linux/arm64 "$IMG"
          docker image inspect --format 'arm64 离线包: {{.Os}}/{{.Architecture}}' "$IMG"
          docker save "$IMG" | gzip -6 > "veyra-backend-${VER}-arm64.tar.gz"

          echo "AMD64_TGZ=veyra-backend-${VER}-amd64.tar.gz" >> $GITHUB_ENV
          echo "ARM64_TGZ=veyra-backend-${VER}-arm64.tar.gz" >> $GITHUB_ENV
          ls -la "$PHONE_APK" "$TV_APK" "veyra-backend-${VER}-amd64.tar.gz" "veyra-backend-${VER}-arm64.tar.gz"
          sha256sum "$PHONE_APK" "$TV_APK"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$TAG"
          echo "Creating release for $TAG"
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            # 本次 tag 还没创建，所以列表里的第 1 个就是上一个版本（取第 2 个会把整段历史都倒进更新日志）
            PREV=$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')
            if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
              NOTES=$(git log "$PREV..HEAD" --pretty=format:"- %s" | head -40)
            fi
            if [ -z "$NOTES" ]; then
              NOTES=$(git log -15 --pretty=format:"- %s")
            fi
            NOTES=$(printf "## Veyra %s 更新内容\n\n%s" "$TAG" "$NOTES")
          fi
          # 两段式发布：先建 draft 把资产传完，最后一步才正式发布。
          # 后端是靠 release published 的 webhook 立刻开始拉包的，如果边传边发，
          # 那一刻资产还在路上，后端只能对着 404 空转重试。draft 兜住这个时间差。
          # 注意 --latest 不能和 --draft 同时用（gh 会报 cannot mark a draft as latest）。
          # 同一个 tag 可能已经有别的 workflow（桌面端）先建好 release 并传了 exe：
          # 这种情况原地转 draft + 追加上传，千万别删 release，否则会把别人的资产一起删掉。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true
            gh release upload "$TAG" \
              "$PHONE_APK" \
              "$TV_APK" \
              "$AMD64_TGZ" \
              "$ARM64_TGZ" \
              --clobber
            if [ -n "$NOTES" ]; then gh release edit "$TAG" --notes "$NOTES"; fi
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" \
              "$PHONE_APK" \
              "$TV_APK" \
              "$AMD64_TGZ" \
              "$ARM64_TGZ" \
              --title "Veyra $TAG" \
              --notes "$NOTES" \
              --draft
          else
            gh release create "$TAG" \
              "$PHONE_APK" \
              "$TV_APK" \
              "$AMD64_TGZ" \
              "$ARM64_TGZ" \
              --title "Veyra $TAG" \
              --generate-notes \
              --draft
          fi
          # 资产齐了才对外发布：这一步之后 webhook 才会带着完整 assets 打到后端。
          # 拆成两步：先转正（触发发布），再标 latest。万一 --latest 出岔子，
          # 版本也已经发出去了，不至于卡在 draft 里谁也看不见。
          gh release edit "$TAG" --draft=false
          gh release edit "$TAG" --latest
          echo "Released $TAG"

