name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '可选：release tag 名（留空则用 app/build.gradle 的 versionName，如 v0.20.1）'
        required: false
        type: string
      release_notes:
        description: '可选：本次 release 介绍（留空则自动根据两个 tag 间的 commit 生成中文更新日志）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 拉全历史 + tag：更新日志需要上一个 v* tag 到 HEAD 的完整 commit 列表
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "platforms;android-37" > /dev/null 2>&1 || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --channel=0 "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Set up Kotlin compiler
        run: |
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.10/kotlin-compiler-2.2.10.zip
          unzip -q /tmp/kotlin.zip -d /opt/kotlin/
          echo "KOTLIN_HOME=/opt/kotlin/kotlinc" >> $GITHUB_ENV

      - name: Restore signing keystore
        run: |
          echo "${{ secrets.VEYRA_KEYSTORE_B64 }}" | base64 -d > $RUNNER_TEMP/veyra-release.keystore

      - name: Build release APK
        env:
          CHENGZI_KEYSTORE: ${{ runner.temp }}/veyra-release.keystore
          CHENGZI_STORE_PASS: ${{ secrets.Veyra_STORE_PASS }}
          CHENGZI_KEY_PASS: ${{ secrets.Veyra_KEY_PASS }}
          CHENGZI_KEY_ALIAS: ${{ secrets.Veyra_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            # 没指定 tag 就用 app/build.gradle 里的 versionName，让人一眼看出版本号
            VER=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/' | tr -d ' ')
            if [ -n "$VER" ]; then TAG="v$VER"; else TAG="v$(date +%Y%m%d-%H%M)"; fi
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          # APK 改名：Veyra-<tag>.apk 给手机/平板，Veyra-TV-<tag>.apk 给电视（轻量构建）
          cp app/build/outputs/apk/release/app-mobile-release.apk Veyra-$TAG.apk
          cp app/build/outputs/apk/release/app-tv-release.apk Veyra-TV-$TAG.apk
          # 后端最新镜像同步进 release（gzip 压缩，NAS 可 docker load 离线部署）
          docker pull gybeyond/veyra-backend:latest
          docker save gybeyond/veyra-backend:latest | gzip -9 > veyra-backend-latest.tar.gz
          ls -la Veyra-$TAG.apk Veyra-TV-$TAG.apk veyra-backend-latest.tar.gz
          sha256sum Veyra-$TAG.apk Veyra-TV-$TAG.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$TAG"
          echo "Creating release for $TAG"
          # 删除已存在的 release（tag push 会自动创建空 release）
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          NOTES="${{ github.event.inputs.release_notes }}"
          if [ -z "$NOTES" ]; then
            # 本次 tag 还没创建，所以列表里的第 1 个就是上一个版本（取第 2 个会把整段历史都倒进更新日志）
            PREV=$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')
            if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
              NOTES=$(git log "$PREV..HEAD" --pretty=format:"- %s" | head -40)
            fi
            if [ -z "$NOTES" ]; then
              NOTES=$(git log -15 --pretty=format:"- %s")
            fi
            NOTES=$(printf "## Veyra %s 更新内容\n\n%s" "$TAG" "$NOTES")
          fi
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" \
              "Veyra-$TAG.apk" \
              "Veyra-TV-$TAG.apk" \
              veyra-backend-latest.tar.gz \
              --title "Veyra $TAG" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" \
              "Veyra-$TAG.apk" \
              "Veyra-TV-$TAG.apk" \
              veyra-backend-latest.tar.gz \
              --title "Veyra $TAG" \
              --generate-notes \
              --latest
          fi
