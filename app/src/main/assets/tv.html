<!doctype html>
<html lang="zh-CN" data-device="tv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Veyra TV</title>
<!-- 电视端独立页面：不加载 app.css / 玻璃 / 转场 / 主题那几套，只有这一个样式表。 -->
<link rel="stylesheet" href="tv.css">
<script>
/* 等比缩放：1rem = 10px @ 1920×1080 设计稿。
   放在 head 里、样式表之后立刻执行，避免首帧按 10px 排一次再跳。
   只用老内核都认的 API（clientWidth / clientHeight / fontSize），
   不依赖 vw、min()、clamp()。 */
(function () {
  function apply() {
    var w = document.documentElement.clientWidth || window.innerWidth || 1920;
    var h = document.documentElement.clientHeight || window.innerHeight || 1080;
    var s = Math.min(w / 1920, h / 1040);
    if (!isFinite(s) || !(s > 0)) s = 1;
    s = Math.max(0.35, Math.min(3, s));
    document.documentElement.style.fontSize = (10 * s) + 'px';
    document.documentElement.setAttribute('data-scale', s.toFixed(2));
  }
  window.__tvApplyScale = apply;
  apply();
  window.addEventListener('resize', function () { setTimeout(apply, 60); });
  window.addEventListener('orientationchange', function () { setTimeout(apply, 120); });
})();
</script>
</head>
<body>
<div id="app">
  <!-- 背景层：当前选中作品的海报做模糊底，替代原来那片纯黑 -->
  <div id="tv-bg" aria-hidden="true"><img id="tv-bg-img" alt=""><span class="veil"></span></div>

  <nav id="rail">
    <div class="brand" title="Veyra TV">V</div>
    <button class="rail-item is-active" type="button" data-nav="home" data-key="nav:home" data-focusable aria-label="首页" title="首页">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 2.8 11h2.6v9.8h5.1v-6h3v6h5.1V11h2.6L12 3.2z"/></svg>
    </button>
    <button class="rail-item" type="button" data-nav="search" data-key="nav:search" data-focusable aria-label="搜索" title="搜索">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 3a7.6 7.6 0 1 0 4.7 13.6l4.1 4.1 1.7-1.7-4.1-4.1A7.6 7.6 0 0 0 10.6 3zm0 2.4a5.2 5.2 0 1 1 0 10.4 5.2 5.2 0 0 1 0-10.4z"/></svg>
    </button>
    <button class="rail-item" type="button" data-nav="library" data-key="nav:library" data-focusable aria-label="我的" title="我的">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12.2a4.6 4.6 0 1 0 0-9.2 4.6 4.6 0 0 0 0 9.2zm0 2.1c-4.5 0-8 2.4-8 5.4V21h16v-1.3c0-3-3.5-5.4-8-5.4z"/></svg>
    </button>
    <button class="rail-account" id="rail-account" type="button" data-account="1" data-key="nav:account" data-focusable aria-label="账号">
      <span class="avatar" id="rail-avatar">V</span>
    </button>
  </nav>
  <main id="stage"><div id="view"></div></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <div id="login" hidden>
    <section class="login-box">
      <h1>登录电视</h1>
      <p id="login-tip">用手机上的 Veyra 扫下面的二维码，账号直接同步过来</p>
      <div id="login-qr" class="login-qr" hidden></div>
      <button id="login-retry" class="btn" type="button" data-focusable data-key="login:retry">显示二维码</button>
      <button id="login-guest" class="btn ghost" type="button" data-focusable data-key="login:guest">先随便看看</button>
    </section>
  </div>

  <div id="account" hidden>
    <section class="account-box">
      <h1 id="account-name">未登录</h1>
      <p id="account-sub">登录后可同步收藏与观看记录</p>
      <p class="account-version" id="account-version">版本 —</p>
      <div class="account-actions">
        <button id="account-mode" class="btn" type="button" data-focusable data-key="acct:mode">进入私密模式</button>
        <button id="account-logout" class="btn" type="button" data-focusable data-key="acct:logout">退出登录</button>
        <button id="account-update" class="btn ghost" type="button" data-focusable data-key="acct:update">检查更新</button>
        <button id="account-close" class="btn ghost" type="button" data-focusable data-key="acct:close">关闭</button>
      </div>
    </section>
  </div>

  <!-- 更新：只在「我的 → 检查更新」里出现，装的一定是电视包（原生按渠道挑附件并校验包名） -->
  <div id="tv-update" hidden>
    <section class="update-box">
      <h1 id="tv-update-title">发现新版本</h1>
      <p id="tv-update-sub"></p>
      <p id="tv-update-notes" hidden></p>
      <div id="tv-update-progress" hidden>
        <div class="update-track"><i id="tv-update-fill"></i></div>
        <span id="tv-update-percent">0%</span>
      </div>
      <div class="update-actions">
        <button id="tv-update-install" class="btn primary" type="button" data-focusable data-key="upd:install">立即更新</button>
        <button id="tv-update-later" class="btn ghost" type="button" data-focusable data-key="upd:later">稍后</button>
      </div>
    </section>
  </div>
</div>
<script src="tv-polyfill.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="tv.js"></script>
</body>
</html>
