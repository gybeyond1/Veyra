plugins {
    id 'com.android.application'
}

android {
    namespace 'com.veyra.gybeyond'
    compileSdk 37

    defaultConfig {
        applicationId 'com.veyra.gybeyond'
        minSdk 26
        targetSdk 36
        versionCode 547
        versionName "0.31.59"
        testInstrumentationRunner 'com.veyra.gybeyond.PlaybackTestRunner'
    }

    // 两个形状：mobile（手机 + 平板）与 tv（电视大屏）。
    //
    // 形态是**构建期常量**（BuildConfig.TV），不是运行时探测：
    // 以前靠 Leanback 特性、uiMode、触摸屏、视口宽度一层层猜，海信/创维/ TCL 那批机器
    // 什么都不声明，猜错就是「电视上跑手机界面」。包都是分开打的，形态在编译时就已经确定，
    // 没有任何理由留一条运行时的判定链，也没有理由让编译期常量以外的分支进包
    // （javac 会把 if (BuildConfig.TV) 的常量条件折叠掉，另一侧不生成字节码）。
    flavorDimensions 'form'
    productFlavors {
        mobile {
            dimension 'form'
            resValue "string", "app_name", "Veyra"
            buildConfigField "boolean", "TV", "false"
            buildConfigField "boolean", "LEGACY", "false"
        }
        tv {
            dimension 'form'
            // 电视独立包：单独包名，能和手机包装在同一台设备上互不覆盖
            applicationIdSuffix '.tv'
            // 桌面/应用列表里叫 Veyra TV，跟手机版分得开
            resValue "string", "app_name", "Veyra TV"
            buildConfigField "boolean", "TV", "true"
            buildConfigField "boolean", "LEGACY", "false"
        }
        // 老电视包（Android 5.1 / API 22），单独一个 flavor，正式 tv 包完全不动。
        //
        // 为什么要单独一个包：2015 年前后的创维（Hi3751）、海信那批机器系统还停在
        // 5.1，minSdk 26 直接 INSTALL_FAILED_OLDER_SDK；而且它们的 System WebView 只有
        // Chromium 37~43，既没有 CSS 变量也没有 grid，tv.css 进去是白屏。
        // 这个包：minSdk 22 + media3 停在 1.4.1（1.5 起要求 23）+ 一份内联变量、flex 排版的
        // tv-legacy.css（运行时按 CSS.supports 自动切换）+ 渲染失败时用原生层报环境。
        // 包名后缀 .tvlegacy，可以和正式电视包装在同一台机器上对比。
        tvlegacy {
            dimension 'form'
            applicationIdSuffix '.tvlegacy'
            minSdk 22
            resValue "string", "app_name", "Veyra TV 老电视版"
            buildConfigField "boolean", "TV", "true"
            buildConfigField "boolean", "LEGACY", "true"
        }
    }

    // 老电视包的 assets：tv 的全量 + tvlegacy 的覆盖文件（tv.html / tv-polyfill.js / tv-legacy.css）
    def tvLegacyAssetsDir = layout.buildDirectory.dir('tvlegacy-assets').get().asFile.path
    tasks.register('syncTvLegacyAssets', Sync) {
        // 同名文件允许重复：后一个 from 覆盖前一个（tvlegacy 的三个文件盖住 tv 的同名文件）
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
        from 'src/tv/assets'
        from 'src/tvlegacy/assets'
        into tvLegacyAssetsDir
    }
    // assets 目录是任务产物，AGP 的 merge / lint / package 都会读它，必须显式声明依赖，
    // 否则 Gradle 9 直接判 implicit dependency 报错。
    tasks.configureEach { task ->
        if (task.name.toLowerCase().contains('tvlegacy') && task.name != 'syncTvLegacyAssets') {
            task.dependsOn 'syncTvLegacyAssets'
        }
    }

    // 打包内置 so 的只有 libffconcat.so（下载合并用），编译产物只有 arm64-v8a 一套。
    // 这个 .so 留在 main 源集里的话，电视包同样带着 arm64 库，而索尼/海信那批
    // MT5896、MT5599 的电视是「64 位芯片 + 32 位用户态」（abilist 只有 armeabi-v7a），
    // 装包直接 INSTALL_FAILED_NO_MATCHING_ABIS。电视端不做离线下载合并，也用不到它，
    // 所以把 .so 收进 mobile 专属源集：电视包变成纯 Java 包，任何 ABI 都装得上。
    sourceSets {
        mobile { jniLibs.srcDirs = ['src/mobile/jniLibs'] }
        tv { jniLibs.srcDirs = [] }
        // 老电视包共用 tv 的全部页面与脚本，只在同名文件上覆盖：
        // tv.html（解析期选样式表）、tv-polyfill.js（补 closest）、tv-legacy.css。
        // 前面的目录优先，所以 src/tvlegacy/assets 里的同名文件赢。
        tvlegacy {
            jniLibs.srcDirs = []
            // Java / res 直接复用 tv 源集（BingeEngine、TvTheme、电视图标都在那边），
            // 只覆盖 assets 里那三个文件。不复制一份代码，避免两边各修一半。
            java.srcDirs = ['src/tv/java']
            res.srcDirs = ['src/tv/res']
            // assets 不能像 res 那样「同名后者覆盖」—— AGP 会直接报 Duplicate resources。
            // 先用 Sync 把 tv 的整份资源铺到 build/tvlegacy-assets，再把 tvlegacy 里的
            // 三个覆盖文件盖上去，老电视包只认这一个目录。
            assets.srcDirs = [tvLegacyAssetsDir]
        }
    }

    signingConfigs {
        release {
            // 接手版签名：从环境变量读取，未设置时回退到本地交付文件（不入库）。
            def ks = System.getenv('CHENGZI_KEYSTORE') ?: '/path/to/chengzi-release.keystore'
            def sp = System.getenv('CHENGZI_STORE_PASS') ?: 'CHANGE_ME_STORE_PASS'
            def kp = System.getenv('CHENGZI_KEY_PASS') ?: 'CHANGE_ME_KEY_PASS'
            storeFile file(ks)
            storePassword sp
            keyAlias System.getenv('CHENGZI_KEY_ALIAS') ?: 'chengzi'
            keyPassword kp
        }
    }

    // resValue / buildConfigField 在 AGP 8 里默认关闭，需要在 buildFeatures 打开
    buildFeatures {
        resValues true
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    // Install device regression tests beside the user's signed app, with separate local data.
    if (providers.gradleProperty('playbackQa').isPresent()) {
        buildTypes.debug.applicationIdSuffix = '.playbackqa'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 压缩 native libs（minSdk 26 ≥ 23 支持从 APK 直接加载压缩 .so）：减小 APK 体积
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

configurations { hongguoCompile }
def hongguoJar = layout.buildDirectory.file('libs/hongguo-core.jar')
def compileHongguo = tasks.register('compileHongguoCore', Exec) {
    inputs.files(fileTree('../third_party/hongguo/src') { include '**/*.kt' })
    inputs.file('../scripts/build-hongguo-core.py')
    outputs.file(hongguoJar)
    doFirst {
        def sdkPath = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT') ?: "${System.getenv('LOCALAPPDATA')}/Android/Sdk"
        def platform = file("${sdkPath}/platforms/android-37.0/android.jar")
        if (!platform.exists()) platform = file("${sdkPath}/platforms/android-37/android.jar")
        commandLine 'python', '-X', 'utf8', file('../scripts/build-hongguo-core.py'),
                '--classpath', (configurations.hongguoCompile.files + [platform]).collect { it.absolutePath }.join(File.pathSeparator),
                '--output', hongguoJar.get().asFile.absolutePath
    }
}

dependencies {
    hongguoCompile('com.squareup.okhttp3:okhttp:4.10.0') { transitive = false }
    hongguoCompile('com.squareup.okio:okio-jvm:3.0.0') { transitive = false }
    hongguoCompile('org.bouncycastle:bcprov-jdk18on:1.80.2') { transitive = false }
    hongguoCompile('org.jsoup:jsoup:1.23.2') { transitive = false }
    hongguoCompile('org.jetbrains.kotlin:kotlin-stdlib:2.2.10') { transitive = false }
    implementation files(hongguoJar).builtBy(compileHongguo)
    // v0.18.32 起黄果 ts→mp4 走 Java Cipher 解密 + MediaExtractor/MediaMuxer（mergeTsToMp4），
    // JavaCPP ffmpeg 三个 jar 已移除（APK 瘦身）
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.10'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core:1.7.0'
    implementation 'org.jsoup:jsoup:1.23.2'
    // media3 版本按形态分开：正式 tv / mobile 用 1.11.1，老电视包停在 1.4.1
    // （1.5 起 minSdk 提到 23，Android 5.1 装不上）。两版 API 的差异只有
    // DefaultLoadControl.getAllocator()，EpisodeLoadControl 里用反射兼容。
    // webkit 只用到 WebViewAssetLoader（1.0 就有）。1.17 要求 minSdk 24，老电视包停 1.7。
    tvImplementation 'androidx.webkit:webkit:1.17.1'
    mobileImplementation 'androidx.webkit:webkit:1.17.1'
    tvlegacyImplementation 'androidx.webkit:webkit:1.7.0'
    tvImplementation 'androidx.media3:media3-exoplayer:1.11.1'
    tvImplementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    tvImplementation 'androidx.media3:media3-ui:1.11.1'
    mobileImplementation 'androidx.media3:media3-exoplayer:1.11.1'
    mobileImplementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    mobileImplementation 'androidx.media3:media3-ui:1.11.1'
    tvlegacyImplementation 'androidx.media3:media3-exoplayer:1.4.1'
    tvlegacyImplementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    tvlegacyImplementation 'androidx.media3:media3-ui:1.4.1'
    // 扫码登录电视：只用 zxing 的纯 Java 解码核心（约 600KB），不拖 appcompat。
    // 电视包没有相机，这些依赖只进手机/平板。
    mobileImplementation 'com.google.zxing:core:3.5.3'
    // 预览用 CameraX：PreviewView 统一处理传感器朝向 + 屏幕方向 + 镜像 + 等比裁剪，
    // 这些是 CameraX 在大量机型上校准过的。自己用 Camera2 + TextureView 推矩阵，
    // 试了两版画面还是歪的 —— 这活儿不该手工做。
    mobileImplementation "androidx.camera:camera-core:1.4.1"
    mobileImplementation "androidx.camera:camera-camera2:1.4.1"
    mobileImplementation "androidx.camera:camera-lifecycle:1.4.1"
    mobileImplementation "androidx.camera:camera-view:1.4.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.0.1'
    // 「下载/传输到远程服务器」：SMB 走 jcifs-ng（SMB1~SMB3 自动协商 + NTLMv2，匿名共享也认），
    // FTP/FTPS 走 commons-net。WebDAV 用已有的 OkHttp，不再引依赖。
    // 只保留真正要用的传递依赖：jcifs-ng 的 servlet-api / annotation-api 是服务端才用的。
    implementation('eu.agno3.jcifs:jcifs-ng:2.1.10') {
        exclude group: 'javax.servlet', module: 'javax.servlet-api'
        exclude group: 'javax.annotation', module: 'javax.annotation-api'
    }
    implementation 'commons-net:commons-net:3.10.0'
}
